<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In | URJIKO Learning Management</title>
  <link rel="stylesheet" href="../CSS/style1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <!-- Brand / Return Header -->
    <div class="auth-nav">
      <a href="landing_page.html" class="auth-back">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <a href="landing_page.html" class="auth-logo">
        <i class="fa-solid fa-graduation-cap"></i> URJIKO <span>LMS</span>
      </a>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-bubble">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2>Welcome Back</h2>
        <p>Access your training coursework, labs, and academic records</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector" id="roleSelector">
        <button type="button" class="role-btn active" data-role="student">
          <i class="fa-solid fa-user-graduate"></i> Student
        </button>
        <button type="button" class="role-btn" data-role="instructor">
          <i class="fa-solid fa-chalkboard-user"></i> Instructor
        </button>
        <button type="button" class="role-btn" data-role="admin">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
      </div>

      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="credential">Student ID or Email</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="credential" placeholder="e.g. 1381/16 or student@haramaya.edu.et" value="1381/16" required>
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link" onclick="alert('Password reset link sent to registered student email.')">Forgot?</a>
          </div>
          <div class="input-with-icon">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="password" value="••••••••••••" placeholder="Enter your portal password" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
              <i class="fa-solid fa-eye" id="toggleEye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-checkbox">
            <input type="checkbox" checked>
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Quick Demo Credentials Box -->
        <div class="demo-account-box">
          <div class="demo-title">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <strong>Quick Demo Access</strong>
          </div>
          <p>Click below to prefill test credentials and enter the student dashboard immediately.</p>
          <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoAndEnter()">
            Launch Student Demo (Gemachis T.)
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <p>New student? <a href="register_student.html">Complete Registration</a></p>
      </div>
    </div>
  </div>

  <script>
    // Role selection toggle
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const role = btn.getAttribute('data-role');
        const cred = document.getElementById('credential');
        if (role === 'instructor') {
          cred.value = 'ins.tesfaye@haramaya.edu.et';
        } else if (role === 'admin') {
          cred.value = 'admin@urjiko.edu.et';
        } else {
          cred.value = '1381/16';
        }
      });
    });

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const eye = document.getElementById('toggleEye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'Index.html';
      }, 700);
    }

    function fillDemoAndEnter() {
      document.getElementById('credential').value = '1381/16';
      document.getElementById('password').value = 'DemoStudent2026';
      window.location.href = 'Index.html';
    }
  </script>
</body>
</html>
